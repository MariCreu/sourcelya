<header class="topbar">
  <a class="logo" routerLink="/dashboard">{{ brand.name }}</a>
  <nav>
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >{{ t().nav.dashboard }}</a
    >
    <a routerLink="/suppliers" routerLinkActive="active">{{ t().nav.suppliers }}</a>
    <a routerLink="/products" routerLinkActive="active">{{ t().nav.products }}</a>
    <a routerLink="/requests" routerLinkActive="active">{{ t().nav.requests }}</a>
  </nav>
  <div class="topbar-actions">
    <app-locale-switch />
    <button class="link-button" (click)="logout()">{{ t().nav.logout }}</button>
  </div>
</header>
