<div class="auth-card">
  @if (!submitted()) {
    <h1>Start free</h1>

    <form (ngSubmit)="onSubmit()">
      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
      </label>

      <label>
        Password
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
  } @else {
    <h1>Check your email</h1>
    <p>We sent a confirmation link to {{ email }}. Confirm it, then log in to set up {{ brand.name }}.</p>
    <p class="switch"><a routerLink="/login">Go to login</a></p>
  }
</div>
